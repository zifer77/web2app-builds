# Workflow buat build APK dari ZIP project Flutter (versi pintar: nyocokin versi sendiri)
name: Build Flutter APK
run-name: "Build ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID job dari backend"
        required: true
        type: string
      zip_path:
        description: "Path ZIP di repo, misal inputs/abc-123.zip"
        required: true
        type: string
      app_name:
        description: "Nama app buat nama file APK"
        required: false
        default: "app"
        type: string
      build_mode:
        description: "Mode build"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
          - profile
      callback_url:
        description: "URL webhook backend"
        required: true
        type: string

# Butuh write biar bisa baca/tulis konten repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB_ID: ${{ inputs.job_id }}
      ZIP_PATH: ${{ inputs.zip_path }}
      APP_NAME: ${{ inputs.app_name }}
      BUILD_MODE: ${{ inputs.build_mode }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # 1. Ambil isi repo dulu bre
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Download ZIP dari repo (pakai token biar repo private juga aman)
      - name: Download ZIP
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          echo "Narik ZIP: $ZIP_PATH"
          curl -fsSL \
            -H "Authorization: token ${{ github.token }}" \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${ZIP_PATH}" \
            -o /tmp/project.zip || cp "$ZIP_PATH" /tmp/project.zip
          ls -lh /tmp/project.zip

      # 3. Ekstrak ZIP ke /tmp/project, kalau ada folder bungkusan ya diratain
      - name: Extract ZIP
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          rm -rf /tmp/extract /tmp/project
          mkdir -p /tmp/extract
          unzip -q /tmp/project.zip -d /tmp/extract
          PUBSPEC=$(find /tmp/extract -maxdepth 2 -name pubspec.yaml -not -path "*/__MACOSX/*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "Waduh, pubspec.yaml nggak ketemu di dalam ZIP"
            exit 1
          fi
          mv "$(dirname "$PUBSPEC")" /tmp/project
          ls -la /tmp/project

      # 4. Cek pubspec.yaml valid atau nggak
      - name: Validate pubspec.yaml
        working-directory: /tmp/project
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          if ! grep -q "^name:" pubspec.yaml; then
            echo "pubspec.yaml nggak punya field name, ZIP-nya kayaknya bukan project Flutter"
            exit 1
          fi
          echo "pubspec.yaml aman, lanjut"

      # 5. Deteksi versi Flutter yang dipakai project (FVM dulu, lalu .metadata), plus versi Java yang cocok
      - name: Detect Flutter and Java version
        id: detect
        working-directory: /tmp/project
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          VERSION=""

          # a) Project pakai FVM? Ya tinggal ikutin
          if [ -f .fvmrc ]; then
            VERSION=$(jq -r '.flutter // empty' .fvmrc 2>/dev/null || true)
          elif [ -f .fvm/fvm_config.json ]; then
            VERSION=$(jq -r '.flutterSdkVersion // empty' .fvm/fvm_config.json 2>/dev/null || true)
          fi

          # b) Kalau nggak ada, baca revision dari .metadata terus cocokin ke tag rilis Flutter
          if [ -z "$VERSION" ] && [ -f .metadata ]; then
            REV=$(grep -m1 -E '^[[:space:]]*revision:' .metadata | sed -E 's/.*revision:[[:space:]]*"?([0-9a-f]{7,40})"?.*/\1/' || true)
            if [ -n "$REV" ]; then
              echo "Revision Flutter dari .metadata: $REV"
              VERSION=$(git ls-remote --tags https://github.com/flutter/flutter.git \
                | awk -v r="$REV" 'index($1, r)==1 && $2 ~ /refs\/tags\/[0-9]+\.[0-9]+\.[0-9]+(\^\{\})?$/ {print $2}' \
                | sed -E 's#refs/tags/##; s#\^\{\}##' | head -n 1 || true)
            fi
          fi

          # Bersihin awalan "v" kalau ada
          VERSION="${VERSION#v}"
          if [ -n "$VERSION" ]; then
            echo "Versi Flutter project: $VERSION"
          else
            echo "Versi Flutter project nggak ketahuan, pakai stable terbaru"
          fi
          echo "flutter_version=$VERSION" >> "$GITHUB_OUTPUT"

          # c) Gradle project lama (< 7.3) nggak jalan di Java 17, jadi pakai Java 11
          JAVA=17
          GV=$(grep -oE 'gradle-[0-9]+\.[0-9]+' android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null | head -n 1 | sed 's/gradle-//' || true)
          if [ -n "$GV" ]; then
            GMAJOR=${GV%%.*}
            GMINOR=${GV#*.}
            if [ "$GMAJOR" -lt 7 ] || { [ "$GMAJOR" -eq 7 ] && [ "$GMINOR" -lt 3 ]; }; then
              JAVA=11
            fi
            echo "Gradle project: $GV"
          fi
          echo "Java dipakai: $JAVA"
          echo "java_version=$JAVA" >> "$GITHUB_OUTPUT"

      # 6. Pasang Java 11 dan 17 (17 jadi default)
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pilih Java yang cocok
        run: |
          if [ "${{ steps.detect.outputs.java_version }}" = "11" ]; then
            echo "JAVA_HOME=$JAVA_HOME_11_X64" >> "$GITHUB_ENV"
            echo "Pakai Java 11 buat project jadul ini"
          else
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "Pakai Java 17"
          fi

      # 7. Pasang Flutter sesuai versi project; kalau gagal atau nggak ketahuan, pakai stable terbaru
      - name: Setup Flutter (versi project)
        id: flutter_pinned
        if: steps.detect.outputs.flutter_version != ''
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Setup Flutter (stable terbaru)
        if: steps.detect.outputs.flutter_version == '' || steps.flutter_pinned.outcome == 'failure'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 8. Kalau gradle-wrapper.jar hilang (sering kejadian pas di-zip), bikin ulang folder android
      - name: Restore gradle-wrapper.jar
        working-directory: /tmp/project
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar ilang, regenerate platform android..."
            PROJECT_NAME=$(grep "^name:" pubspec.yaml | head -n 1 | awk '{print $2}')
            flutter create --platforms=android --project-name "$PROJECT_NAME" .
          else
            echo "gradle-wrapper.jar aman"
          fi

      # 9. Tarik dependency
      - name: Flutter pub get
        working-directory: /tmp/project
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee -a /tmp/build.log
          flutter pub get 2>&1 | tee -a /tmp/build.log

      # 10. Build APK. Kalau gagal gara-gara Gradle kejadulan atau AGP 9, benerin otomatis lalu coba lagi (maks 3x)
      - name: Build APK
        working-directory: /tmp/project
        run: |
          for ATTEMPT in 1 2 3; do
            echo "=== Percobaan build ke-$ATTEMPT ===" | tee -a /tmp/build.log
            set +e
            flutter build apk --${BUILD_MODE} --split-per-abi > /tmp/attempt.log 2>&1
            CODE=$?
            set -e
            cat /tmp/attempt.log | tee -a /tmp/build.log
            if [ "$CODE" -eq 0 ]; then
              echo "Build sukses!" | tee -a /tmp/build.log
              exit 0
            fi

            FIXED=0

            # Fix 1: Gradle project lebih rendah dari minimum Flutter, naikin versi wrapper
            if grep -q "minimum supported version of" /tmp/attempt.log; then
              NEED=$(grep -oE "minimum supported version of [0-9]+\.[0-9]+(\.[0-9]+)?" /tmp/attempt.log | tail -n 1 | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" || true)
              NEED=$(echo "$NEED" | sed -E 's/^([0-9]+\.[0-9]+)\.0$/\1/')
              if [ -n "$NEED" ] && [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
                echo "Naikin Gradle ke $NEED otomatis" | tee -a /tmp/build.log
                sed -i -E "s#^distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${NEED}-all.zip#" android/gradle/wrapper/gradle-wrapper.properties
                FIXED=1
              fi
            fi

            # Fix 2: AGP 9 + newDsl, matiin newDsl biar kode project lama tetep kebaca
            if grep -q "android.newDsl" /tmp/attempt.log && ! grep -q "^android.newDsl=false" android/gradle.properties 2>/dev/null; then
              echo "Matiin android.newDsl otomatis" | tee -a /tmp/build.log
              printf '\nandroid.newDsl=false\n' >> android/gradle.properties
              FIXED=1
            fi

            if [ "$FIXED" -eq 0 ]; then
              echo "Nggak ada perbaikan otomatis yang cocok, berhenti di sini" | tee -a /tmp/build.log
              exit 1
            fi
          done
          echo "Udah 3x nyoba tapi tetep gagal" | tee -a /tmp/build.log
          exit 1

      # 11. Rename APK jadi {app_name}-{abi}.apk
      - name: Rename APK
        working-directory: /tmp/project
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          mkdir -p /tmp/out
          COUNT=0
          for f in build/app/outputs/flutter-apk/app-*-${BUILD_MODE}.apk; do
            [ -f "$f" ] || continue
            ABI=$(basename "$f" .apk | sed -E "s/^app-//; s/-${BUILD_MODE}\$//")
            cp "$f" "/tmp/out/${APP_NAME}-${ABI}.apk"
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "Nggak ada APK hasil build, aneh banget"
            exit 1
          fi
          ls -lh /tmp/out

      # 12. Simpen APK sebagai artifact selama 7 hari
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job_id }}
          path: /tmp/out/*.apk
          retention-days: 7

      # 13. Kabarin backend kalau sukses
      - name: Notify Backend (SUCCESS)
        if: success()
        run: |
          jq -n \
            --arg job_id "$JOB_ID" \
            --arg status "success" \
            --argjson run_id "${{ github.run_id }}" \
            --arg run_url "$RUN_URL" \
            --arg artifact_name "apk-${JOB_ID}" \
            '{job_id: $job_id, status: $status, run_id: $run_id, run_url: $run_url, artifact_name: $artifact_name}' \
          | curl -sS -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @-

      # 14. Kabarin backend kalau gagal, bawa 500 baris log terakhir
      - name: Notify Backend (FAILED)
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            ERROR_LOG=$(tail -n 500 /tmp/build.log)
          else
            ERROR_LOG="Log kosong, build gagal sebelum sempat nyatet apa-apa"
          fi
          jq -n \
            --arg job_id "$JOB_ID" \
            --arg status "failed" \
            --argjson run_id "${{ github.run_id }}" \
            --arg run_url "$RUN_URL" \
            --arg error_log "$ERROR_LOG" \
            '{job_id: $job_id, status: $status, run_id: $run_id, run_url: $run_url, error_log: $error_log}' \
          | curl -sS -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @-
